<!doctype html>
<!-- O favicon.svg no tamanho ?t=N (px), para virar PNG. -->
<style>html, body { margin: 0; background: transparent; } img { display: block; }</style>
<img src="/img/favicon.svg" alt="">
<script>const t = new URLSearchParams(location.search).get("t") || 32; document.querySelector("img").width = document.querySelector("img").height = t;</script>
